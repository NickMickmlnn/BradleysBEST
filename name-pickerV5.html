<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Winner Picker ✈️</title>
  <style>
    :root {
      --bg1: #0ea5e9; /* sky */
      --bg2: #93c5fd; /* sky */
      --paper: #fffefa;
      --ink: #111827;
      --accent: #0f172a; /* UI text */
      --btn: #111827;
      --btnText: #ffffff;
      --accent2: #f59e0b; /* highlight */
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow: hidden;
      color: var(--accent);
    }

    /* Stage */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* UI Bar */
    .ui {
      position: absolute;
      inset: 16px 16px auto 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      z-index: 50;
    }

    .ui button, .ui .toggle {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      background: var(--btn);
      color: var(--btnText);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transition: transform 0.06s ease, filter 0.2s ease;
    }
    .ui button.secondary {
      background: #ffffff;
      color: var(--accent);
      border: 1px solid rgba(0,0,0,0.08);
    }
    .ui button:active { transform: translateY(1px); }

    .ui .status {
      margin-left: 8px;
      font-size: 14px;
      opacity: 0.9;
    }

    .gear { margin-left: auto; background:#ffffff; color: var(--accent); border: 1px solid rgba(0,0,0,0.08); }

    /* Names Editor Panel */
    .panel {
      position: absolute;
      right: 16px;
      top: 72px;
      width: min(400px, 92vw);
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      z-index: 60;
      display: none;
    }
    .panel.open { display: block; }
    .panel h3 { margin: 0 0 8px 0; }
    .panel textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border-radius: 12px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid rgba(0,0,0,0.1);
      outline: none;
    }
    .panel .row { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .panel label { font-size: 13px; }

    /* Slip (falling paper) */
    .slip {
      position: fixed;
      top: -80px;
      left: 0;
      width: 160px;
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      padding: 10px 12px;
      transform: rotate(var(--rot, -6deg));
      filter: drop-shadow(0 1px 0 rgba(0,0,0,0.05));
      opacity: 0.96;
      will-change: transform, top, left;
      pointer-events: none;
    }
    .slip .lines {
      background: repeating-linear-gradient(
        to bottom,
        #ffffff 0px,
        #ffffff 18px,
        #e8f0fe 19px
      );
      padding: 4px 6px;
      border-radius: 6px;
    }
    .slip .name { font-weight: 700; font-size: 16px; }
    .slip .note { font-size: 11px; opacity: 0.55; }

    @keyframes fall {
      0% { transform: translateY(-120px) rotate(var(--rot)); }
      100% { transform: translateY(120vh) rotate(calc(var(--rot) * -1)); }
    }

    /* Plane + Banner */
    #flyer {
      position: fixed;
      top: 40%;
      left: 0%;
      transform: translateX(-100%);
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 70;
      pointer-events: none;
      flex-direction: row-reverse;
    }

    .plane {
      width: 500px;
      aspect-ratio: 1.8 / 1;
    }

    .rope { width: 220px; height: 60px; margin-right: -40px; }

    /* ✈️ Aerial banner look (flipped for rope on right side) */
.banner {
  position: relative;
  display: inline-block;
  min-width: 360px;
  max-width: 72vw;
  padding: 16px 22px;
  color: var(--ink);
  background:
    /* subtle fabric weave */
    repeating-linear-gradient(45deg, #f6f6f6 0 6px, #f6f6f6 6px 12px),
    /* soft vertical shading */
    linear-gradient(to bottom, rgba(0,0,0,0.04), rgba(255,255,255,0) 30%, rgba(0,0,0,0.05));         /* sewn edge */
  border-radius: 6px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.22);
  font-weight: 800;
  font-size: clamp(18px, 3.4vw, 28px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  /* gentle fabric flutter */
  transform-origin: right center;  /* 👉 flip pivot */
  animation: banner-wave 2.4s ease-in-out infinite alternate;
}

/* little triangular “connector” on the rope side (👉 now right side) */
.banner::before {
  content: "";
  position: absolute;
  right: -18px;              /* 👉 was left */
  top: 50%;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  border-left: 18px solid #1f2937;  /* 👉 flip to left-pointing triangle */
}

/* tiny stitched holes (grommet vibe) along the top/bottom edges */
.banner::after {
  content: "";
  position: absolute;
  inset: 6px 8px;
  border-radius: 4px;
  pointer-events: none;
  outline-offset: -8px;
}

/* fabric flutter keyframes */
@keyframes banner-wave {
  0%   { transform: skewY(0deg) rotate(0.1deg); }
  50%  { transform: skewY(1.1deg) rotate(-0.2deg); }
  100% { transform: skewY(-1.1deg) rotate(0.2deg); }
}

@media (prefers-reduced-motion: reduce) {
  .banner { animation: none; }
}


    @keyframes fly {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(160vw); }
    }

    .hidden { display: none; }

    /* Winner badge (optional pop) */
    .toast {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%) scale(0.95);
      background: rgba(255,255,255,0.9);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      font-weight: 800;
      z-index: 80;
      opacity: 0;
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* Clouds (simple ambience) */
    .cloud {
      position: absolute; top: 10%; left: -30%; width: 220px; height: 80px;
      background: rgba(255,255,255,0.8);
      filter: blur(2px);
      border-radius: 50px;
      box-shadow: 60px 10px 0 10px rgba(255,255,255,0.65), 110px -10px 0 10px rgba(255,255,255,0.7);
      animation: cloud 60s linear infinite;
      z-index: 5;
    }
    .cloud.c2 { top: 26%; animation-duration: 85s; transform: scale(1.15); }
    .cloud.c3 { top: 62%; animation-duration: 100s; transform: scale(1.35); }
    @keyframes cloud { from { left: -40%; } to { left: 120%; } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- Ambient clouds -->
    <div class="cloud"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <!-- UI Controls -->
    <div class="ui" role="toolbar" aria-label="Controls">
      <button id="startBtn">Start Rain</button>
      <button id="stopBtn" class="secondary">Stop Rain</button>
      <button id="pickBtn">Pick Winner ✨</button>
      <button id="resetBtn" class="secondary" title="Clear used & start fresh">Reset</button>
      <span class="status" id="status">Idle</span>
      <button id="gearBtn" class="gear" title="Edit names">⚙️ Names</button>
    </div>

    <!-- Names panel -->
    <div class="panel" id="panel">
      <h3>Names (one per line)</h3>
      <textarea id="namesInput" placeholder="Jane Doe\nJohn Smith\n…"></textarea>
      <div class="row">
        <button id="saveNames">Save</button>
        <button id="closePanel" class="secondary">Close</button>
        <label><input type="checkbox" id="noRepeat" checked /> No repeat until all picked</label>
      </div>
      <div style="margin-top:8px; font-size:12px; opacity:.8">Tip: Names are saved locally in your browser (localStorage). You can paste a new list each week.</div>
    </div>

    <!-- Plane & banner (injected on pick) -->
    <div id="flyer" class="hidden" aria-hidden="true">
      <img class="plane" src="plane.png" alt="Plane pulling banner">
      <svg class="rope" width="220" height="60" viewBox="0 0 220 60" preserveAspectRatio="none">
        <path d="M0,30 C60,40 160,40 220,20"
              fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
      </svg>

      <div class="banner" id="banner">Winner: TBD</div>
    </div>

    <div class="toast" id="toast">Winner Picked! 🎉</div>
  </div>

  <script>
    /* =============================
       ✈️ Weekly Winner Picker
       Vanilla JS — no libraries
       Works inside Wix HTML embed or a WordPress HTML block
       ============================= */

    const LS_KEY = 'winnerPicker_names_v1';
    const LS_USED = 'winnerPicker_used_v1';

    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const pickBtn = document.getElementById('pickBtn');
    const resetBtn = document.getElementById('resetBtn');
    const gearBtn = document.getElementById('gearBtn');

    const panel = document.getElementById('panel');
    const namesInput = document.getElementById('namesInput');
    const saveNames = document.getElementById('saveNames');
    const noRepeat = document.getElementById('noRepeat');

    const flyer = document.getElementById('flyer');
    const banner = document.getElementById('banner');
    const toast = document.getElementById('toast');

    const FLY_SPEED_PX_PER_SEC = 260;

    let spawnTimer = null;
    let running = false;
    let activeSlips = new Set();
    let flyerLoop = false;
    let flyAnim = null;

    function defaultNames() {
      return [
        'Alex Diller','Hannah Dinius','Dana (Wayhome Team)','Nicole Rosswurm','Greg Bradley',
        'Brandy','Erika','Andrew','Michael','Nick Resor'
      ];
    }

    function getNames() {
      const raw = localStorage.getItem(LS_KEY);
      let arr = [];
      if (raw && raw.trim()) {
        arr = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      } else {
        arr = defaultNames();
      }
      return Array.from(new Set(arr)); // dedupe
    }

    function setNames(list) {
      localStorage.setItem(LS_KEY, list.join('\n'));
    }

    function getUsedSet() {
      try {
        const raw = localStorage.getItem(LS_USED);
        if (!raw) return new Set();
        return new Set(JSON.parse(raw));
      } catch { return new Set(); }
    }

    function setUsedSet(set) {
      localStorage.setItem(LS_USED, JSON.stringify(Array.from(set)));
    }

    function updateStatus(msg) { statusEl.textContent = msg; }

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function spawnSlip(name) {
      const slip = document.createElement('div');
      slip.className = 'slip';
      slip.style.left = rand(0, 100) + 'vw';
      slip.style.setProperty('--rot', (Math.random() > 0.5 ? 1 : -1) * rand(4, 12) + 'deg');

      const inner = document.createElement('div');
      inner.className = 'lines';

      const title = document.createElement('div');
      title.className = 'name';
      title.textContent = name;

      const note = document.createElement('div');
      note.className = 'note';
      const msgs = ['🎟️','Lucky day?','Good vibes','Pick me!','Fingers crossed','Let\'s go!'];
      note.textContent = msgs[Math.floor(rand(0, msgs.length))];

      inner.appendChild(title);
      inner.appendChild(note);
      slip.appendChild(inner);
      stage.appendChild(slip);
      activeSlips.add(slip);

      const dur = rand(6, 12).toFixed(2) + 's';
      slip.style.animation = `fall ${dur} linear forwards`; 
      slip.addEventListener('animationend', () => {
        if (slip.parentNode) slip.parentNode.removeChild(slip);
        activeSlips.delete(slip);
      });
    }

    function startRain() {
      if (running) return;
      running = true;
      updateStatus('Raining names…');
      const names = getNames();
      // spawn a slip every 250–400ms
      function loop() {
        if (!running) return;
        spawnSlip(names[Math.floor(Math.random() * names.length)]);
        const next = rand(250, 400);
        spawnTimer = setTimeout(loop, next);
      }
      loop();
    }

    function stopRain({soft=false}={}) {
      running = false;
      updateStatus('Stopped');
      if (spawnTimer) clearTimeout(spawnTimer);
      spawnTimer = null;
      // fade out remaining slips
      activeSlips.forEach(el => {
        el.style.transition = 'opacity .5s ease, transform .5s ease';
        el.style.opacity = soft ? '0.35' : '0';
        el.style.transform += ' translateY(12px)';
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); activeSlips.delete(el); }, 520);
      });
      activeSlips.clear();
    }

    function pickWinner() {
      const list = getNames();
      let used = getUsedSet();
      const pool = list.filter(n => !used.has(n));
      let winner;
      if (noRepeat.checked) {
        if (pool.length === 0) {
          // reset cycle
          used = new Set();
          setUsedSet(used);
          winner = list[Math.floor(Math.random()*list.length)];
        } else {
          winner = pool[Math.floor(Math.random()*pool.length)];
        }
        used.add(winner);
        setUsedSet(used);
      } else {
        winner = list[Math.floor(Math.random()*list.length)];
      }

      // Present
      stopRain({soft:true});
      flyerLoop = true;
      flyAcross(winner);
      popToast('Winner Picked! 🎉');
    }

    function flyAcross(winner) {
      banner.textContent = 'Winner: ' + winner;
      flyer.classList.remove('hidden');

      flyer.style.top = Math.round(rand(28, 62)) + '%';

      if (flyAnim) {
        try { flyAnim.cancel(); } catch {}
        flyAnim = null;
      }

      const W = window.innerWidth;
      const w = flyer.getBoundingClientRect().width;
      const margin = 40;

      const startX = -w - margin;
      const endX = W + margin;

      const distance = endX - startX;
      const duration = (distance / FLY_SPEED_PX_PER_SEC) * 1000;

      flyAnim = flyer.animate(
        [
          { transform: `translateX(${startX}px)` },
          { transform: `translateX(${endX}px)` }
        ],
        { duration, easing: 'linear', fill: 'forwards' }
      );

      flyAnim.onfinish = () => {
        if (flyerLoop) {
          flyAcross(winner);
        } else {
          flyer.classList.add('hidden');
          flyAnim = null;
        }
      };
    }

    function popToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    }

    // UI wire-up
    startBtn.addEventListener('click', startRain);
    stopBtn.addEventListener('click', () => stopRain());
    pickBtn.addEventListener('click', pickWinner);
    resetBtn.addEventListener('click', () => {
      flyerLoop = false;
      if (flyAnim) {
        try { flyAnim.cancel(); } catch {}
        flyAnim = null;
      }
      flyer.classList.add('hidden');
      localStorage.removeItem(LS_USED);
      popToast('Reset complete');
      updateStatus('Idle');
    });

    gearBtn.addEventListener('click', () => {
      panel.classList.toggle('open');
      namesInput.value = getNames().join('\n');
    });
    document.getElementById('closePanel').addEventListener('click', () => panel.classList.remove('open'));
    saveNames.addEventListener('click', () => {
      const lines = namesInput.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      setNames(lines);
      panel.classList.remove('open');
      popToast('Names saved');
    });

    // Init
    updateStatus('Idle');
    if (!localStorage.getItem(LS_KEY)) {
      setNames(defaultNames());
    }
  </script>
</body>
</html>
